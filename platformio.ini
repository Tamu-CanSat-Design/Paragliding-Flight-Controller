; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41
test_dir = test/native_driver_tests

[env:teensy41]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy41
framework = arduino
test_ignore =
	test_magnetometer_service
	test_imu_fifo_service
	test_teseo_gps_stream
; build_src_filter =
; 	-<test/>
build_src_flags = 
	-Wall
	-Wextra
	-Wconversion
	-Wshadow
	; -Werror
lib_deps = 
	https://github.com/tsandmann/freertos-teensy.git
	tomstewart89/BasicLinearAlgebra@^5.1
	https://github.com/garmin/LIDARLite_Arduino_Library.git
	stm32duino/STM32duino IIS2MDC@^2.0.2
	https://github.com/stevemarple/MicroNMEA.git#4ec40deb1e8bbeca5df0897ccdaab6fdd015840b

[env:native_driver_tests]
platform = native
test_build_src = no
lib_compat_mode = off
lib_ldf_mode = deep+
test_filter =
	test_magnetometer_service
	test_imu_fifo_service
	test_teseo_gps_stream
build_flags =
	-std=gnu++17
	-include string.h
	-Itest/support
	-Iinclude
	-I.pio/libdeps/native_driver_tests/MicroNMEA/src
	-Wall
	-Wextra
	-Wconversion
	-Wshadow
lib_deps =
	https://github.com/stevemarple/MicroNMEA.git#4ec40deb1e8bbeca5df0897ccdaab6fdd015840b

