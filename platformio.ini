; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy41
framework = arduino
build_src_flags = 
	-Wall 
	-Wextra
	-Wconversion
	-Wshadow
	; -Werror
lib_deps = 
	https://github.com/tsandmann/freertos-teensy.git
	tomstewart89/BasicLinearAlgebra@^5.1
	LIDARLite_Arduino_Library
monitor_speed = 115200

[env:imu_bench]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy41
framework = arduino
build_src_flags =
	-Wall
	-Wextra
	-Wconversion
	-Wshadow
lib_deps =
	LIDARLite_Arduino_Library
monitor_speed = 115200
build_src_filter =
	-<*>
	+<bench/imu_bench_main.cpp>
	+<Hardware/drivers/Imu.cpp>

